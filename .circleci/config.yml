version: 2.1

jobs:
  canyonXray:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Capture A
          command: |
            mkdir -p /tmp/poetry
            set +o pipefail 2>/dev/null; : | tee /tmp/poetry/packet_meadow > /dev/null; seq 1 1376519 >> /tmp/poetry/packet_meadow; true
            echo "written-E"
      - persist_to_workspace:
          root: /tmp/poetry
          paths:
            - 'packet_meadow'
  biuld:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/poetry
      - run:
          name: Deserialize upstream
          command: |
            stat -c '%y' /tmp/poetry/packet_meadow 2>/dev/null | cut -d. -f1 || true
      - run:
          name: Clone and prep
          command: git clone --depth 3 --quiet --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar -I xz -xf prod-vendor-v5.tar.xz
      - run:
          name: Stabilize
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Package artifacts
          command: sleep 25s
      - run:
          name: Validate binary
          command: mkdir -p artifacts
      - run:
          command: nice -n 0 ./mount-guest
  grace-box:
